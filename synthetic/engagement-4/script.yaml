# the client simulator for synthetic #4 — matched by substring of the ask's text
responses:
  - topic: vp-routing
    match: [VP, second approval, over $1,000, over 1,000]
    file: responses/vp-routing-confirmation.md
    behavior: answer
  - topic: receipts
    match: [receipt]
    file: responses/receipt-threshold-nonanswer.md
    behavior: non-answer          # exercises honest absence surviving a response
  - topic: corporate-card
    match: [corporate card, card program, Treasury]
    behavior: silence             # sits with Treasury — no response this round
