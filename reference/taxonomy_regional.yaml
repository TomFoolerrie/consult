# Schema: meta > regional_dimension > domains[L1 > L2 > L3[]]
# Note: "Regional" variant — see ambiguities section at bottom

meta:
  source_doc: BT_Business_Cycle_Taxonmies_Regional.pdf
  publisher: CFGI
  year: 2023
  practice: Business Transformation
  total_l1_domains: 6
  regional_dimension:
    observation: >
      Despite the filename indicating a "Regional" variant, the rendered pages contain
      NO explicit regional breakdowns (no country/region columns, no regional L3 variants,
      no region-specific notes or contacts). The taxonomy structure is identical to a
      standard global CFGI taxonomy. Either (a) the regional content exists on pages not
      rendered by the PDF reader (the file is 213KB suggesting possible additional pages),
      or (b) "Regional" in the title refers to CFGI regional office use rather than
      geographic process variants.
    regions_covered: null          # None found in rendered content
    region_specific_l3s: null      # None found in rendered content
    region_specific_notes: null    # None found in rendered content
    human_verify_required: true

domains:
  - id: "1.0"
    name: Record-to-Report
    abbrev: RTR
    theme: Close the Books
    description: >
      Preparation activities and execution of month-end close,
      management reporting, and business/stakeholder support
    l2s:
      - id: "1.1"
        name: Pre-Close Set Up
        l3s:
          - "1.1.1 Master Data Configuration"
          - "1.1.2 Ledger Configuration"
          - "1.1.3 Data Governance"
          - "1.1.4 Cost and Profit Center Reporting"
          - "1.1.5 Develop & Maintain Close Checklist & Calendar"
          - "1.1.6 Hold Pre-Close Meetings"
      - id: "1.2"
        name: Close
        notes: "Sub-Ledger Close includes Fixed Assets, Inventory, Payroll Accounting/Bonuses/Commissions, etc."
        l3s:
          - "1.2.1 Sub-Ledger Close"
          - "1.2.2 Intercompany & Allocations"
          - "1.2.3 Accruals"
          - "1.2.4 Non-Standard Journal Entries"
          - "1.2.5 Trial Balance & GL Close"
          - "1.2.6 Account Reconciliations"
          - "1.2.7 Prepare Local Financials"
          - "1.2.8 Management Review & Analysis"
      - id: "1.3"
        name: Consolidation
        l3s:
          - "1.3.1 Collect Data"
          - "1.3.2 IC Eliminations"
          - "1.3.3 Equity Accounting"
          - "1.3.4 Topside Entries"
          - "1.3.5 Consolidate Information"
          - "1.3.6 Corporate Review"
          - "1.3.7 Variance Analysis"
          - "1.3.8 Analytic Driven Review"
      - id: "1.4"
        name: Reporting
        l3s:
          - "1.4.1 Management Reporting"
          - "1.4.2 Consolidated Financial Statements"
          - "1.4.3 Prepare Regulatory Reports"
          - "1.4.4 Investor Relations Support"
          - "1.4.5 Treasury Support"
          - "1.4.6 Close & Reporting Analytics"
      - id: "1.5"
        name: Accounting Policy
        l3s:
          - "1.5.1 Baseline Accounting Policies & Procedures"
          - "1.5.2 Revenue Recognition (606)"
          - "1.5.3 Lease Accounting (842)"
          - "1.5.4 New Accounting Standards"
          - "1.5.5 Manage User Access Rights (SOD)"
