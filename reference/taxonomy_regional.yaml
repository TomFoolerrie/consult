# ─────────────────────────────────────────────────────────────────────────────
# COMPARISON vs. STANDARD 7-DOMAIN TAXONOMY (as described in the task brief)
# ─────────────────────────────────────────────────────────────────────────────
# Standard brief mentions 7 L1s: Procure to Pay, Order to Cash, Record to Report,
# FP&A, Treasury, Tax, Risk/Policy/Controls
#
# This document uses 6 L1s with different naming conventions:
#   RTR  = Record-to-Report          (matches)
#   QTC  = Quote-to-Cash             (≈ Order to Cash; also covers Sales Strategy)
#   STP  = Source-to-Pay             (≈ Procure to Pay; broader scope)
#   FP&A = Financial Planning & Anal (matches)
#   HTR  = Hire-to-Retire            (NEW — not in standard 7-domain brief)
#   ATR  = Acquire-to-Retire         (NEW — not in standard 7-domain brief)
#
# MISSING vs. standard brief:
#   - Treasury  (partially covered via 1.4.5, 4.2.4 but no standalone L1)
#   - Tax       (partially covered via 3.6.2 1099, 5.9 Payroll Tax; no standalone L1)
#   - Risk/Policy/Controls (embedded in governance nodes; no standalone L1)
#
# ─────────────────────────────────────────────────────────────────────────────
# AMBIGUITIES — HUMAN REVIEW REQUIRED
# ─────────────────────────────────────────────────────────────────────────────
ambiguities:
  - id: A1
    issue: >
      No regional content found. The PDF filename contains "Regional" but all
      7 rendered pages are standard taxonomy slides with no geographic variants.
      Possible explanations: (1) pages beyond p.7 contain regional content but
      were not rendered by the tool; (2) a later version of this file exists;
      (3) "Regional" refers to CFGI regional teams, not geographic process variants.
    action: Obtain and re-read the full PDF using a native PDF reader to confirm page count and regional content.
  - id: A2
    issue: >
      5.0 HTR L3s are explicitly marked "Placeholder for later release" in the source.
      All L3 boxes are empty on the slide.
    action: Obtain updated HTR L3 content when released.
  - id: A3
    issue: >
      6.0 ATR detail page was not present in rendered content (only L2s from overview).
    action: Confirm whether ATR L3 detail page exists in full document.
  - id: A4
    issue: >
      Standard 7-domain brief includes Treasury, Tax, and Risk/Policy/Controls as
      standalone L1s. This document omits them. These may be in a companion document
      or represent an alternate taxonomy version.
    action: Reconcile with the primary taxonomy document and any Tax/Treasury/Risk supplements.
  - id: A5
    issue: >
      3.6.2 references "1099 Reporting" — a US-specific tax form. If this is truly
      a regional variant, equivalent non-US mechanisms (e.g., VAT returns, withholding
      tax filings) may be missing or intentionally excluded.
    action: Confirm whether non-US payment reporting equivalents are addressed elsewhere.
