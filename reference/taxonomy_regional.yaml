  - id: "2.0"
    name: Quote-to-Cash
    abbrev: QTC
    theme: Sales & Revenue
    description: >
      Sales enablement, order fulfillment & cash collections,
      customer feedback & sales adjustments, and revenue recognition
    l2s:
      - id: "2.1"
        name: Sales Strategy & Demand Forecasting
        l3s:
          - "2.1.1 Demand and Revenue Forecasting"
      - id: "2.2"
        name: Pricing & Order Management
        l3s:
          - "2.2.1 Quote Process"
          - "2.2.2 Order Process"
          - "2.2.3 Customer Relationship Management (CRM)"
          - "2.2.4 Contract Management"
      - id: "2.3"
        name: Credit Analysis
        l3s:
          - "2.3.1 Review Existing Accounts"
          - "2.3.2 Analyze/Approve new account applications"
          - "2.3.3 Produce credit / collections reports"
          - "2.3.4 Customer Credit Analytics"
          - "2.3.5 Reinstate / suspend accounts based on credit policies"
      - id: "2.4"
        name: Invoice Customer
        l3s:
          - "2.4.1 Execute and complete service delivery"
          - "2.4.2 Maintain customer/product master files"
          - "2.4.3 Generate customer billing data"
          - "2.4.4 Transmit billing data to customers"
          - "2.4.5 Post receivable entries"
          - "2.4.6 Resolve customer billing inquiries"
      - id: "2.5"
        name: Process Accounts Receivable
        l3s:
          - "2.5.1 Receive/Deposit customer payments"
          - "2.5.2 Apply Cash remittances"
          - "2.5.3 Prepare AR reports"
          - "2.5.4 Post AR activity to the general ledger"
      - id: "2.6"
        name: Manage and Process Collections
        l3s:
          - "2.6.1 Analyze delinquent account balances"
          - "2.6.2 Correspond/Negotiate w/ delinquent accounts"
          - "2.6.3 Discuss account resolution with internal parties"
          - "2.6.4 Process adjustments/write off balances"
          - "2.6.5 Collections Monitoring Analytics"
      - id: "2.7"
        name: Process Adjustments and Deductions
        l3s:
          - "2.7.1 Analyze adjustments"
          - "2.7.2 Correspond/Negotiate with customer"
          - "2.7.3 Discuss resolution with internal parties"
          - "2.7.4 Prepare chargeback invoices"
          - "2.7.5 Process related entries"
      - id: "2.8"
        name: Revenue Recognition
        l3s:
          - "2.8.1 Obtain Revenue Data Source"
          - "2.8.2 Reconcile source data to internal data (GL)"
          - "2.8.3 Reconcile deferred revenue or contra-asset schedules"
          - "2.8.4 Prepare and process related entries"
      - id: "2.9"
        name: QTC Policies & Governance
        l3s:
          - "2.9.1 Establish Credit Policies"
          - "2.9.2 Establish AR Policies"
          - "2.9.3 Establish policies for delinquent accounts"
          - "2.9.4 Establish policies/procedures for adjustments"
          - "2.9.5 Establish policies/procedures for revenue recognition"

