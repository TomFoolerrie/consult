# CFGI Work Taxonomy — single source of truth (structure only).
# Diagnostic lens baselines live in taxonomy_baselines.yaml (optional sidecar).
version: 1
source: Work Taxonomy High-Level Overview deck (CFGI)
domains:
  - id: procure-to-pay
    name: Procure to Pay
    description: Purchase raw materials and services; receive goods/services and pay bills
    contacts: []
    l2:
      - id: master-data-management
        name: Master Data Management
        l3:
          - Vendor Data Maintenance
          - Item Master Maintenance
          - Workflow Maintenance
          - Master Data Monitoring
      - id: sourcing
        name: Sourcing
        l3:
          - Spend Category Management
          - Vendor Relationship Management
          - Contract Management
          - Spend Management
          - Demand Forecasting
          - Sourcing Strategy
      - id: procurement
        name: Procurement
        l3:
          - Purchase Requisition
          - Purchase Order
          - Purchase Card
          - KPI Tracking
      - id: receiving
        name: Receiving
        l3:
          - Receipt of Goods / Materials (Direct & Indirect)
          - Receipt of Services
          - Discrepancy Resolution
      - id: invoice-processing
        name: Invoice Processing
        l3:
          - Invoice Receiving
          - Invoice Matching
          - Invoice Approval
          - Invoice Discrepancy Resolution
          - Non-PO Invoice Processing
          - AP Aging Review
      - id: payment
        name: Payment
        l3:
          - Vendor Payment
          - 1099 Reporting
          - Open PO Clearing
          - Clear Unmatched Invoices and Receipts
          - Payment Strategies (e.g., terms negotiation)
          - Payment Tracking & Analytics

  - id: order-to-cash
    name: Order to Cash
    description: Receive and fulfill customer requests; process orders and collect cash
    contacts: []
    l2:
      - id: credit-analysis
        name: Credit Analysis
        l3:
          - Establish credit policies
          - Review existing accounts
          - Analyze/Approve new account applications
          - Produce credit / collections reports
          - Customer Credit Analytics
          - Reinstate / suspend accounts based on credit policies
      - id: invoice-customer
        name: Invoice Customer
        l3:
          - Maintain customer/product master files
          - Generate customer billing data
          - Transmit billing data to customers
          - Post receivable entries
          - Resolve customer billing inquiries
          - Demand and Revenue Forecasting
      - id: process-accounts-receivable
        name: Process Accounts Receivable
        l3:
          - Establish AR policies
          - Receive/Deposit customer payments
          - Apply cash remittances
          - Prepare AR reports
          - Post AR activity to the general ledger
      - id: manage-and-process-collections
        name: Manage and Process Collections
        l3:
          - Establish policies for delinquent accounts
          - Analyze delinquent account balances
          - Correspond/Negotiate with delinquent accounts
          - Discuss account resolution with internal parties
          - Process adjustments/write off balances
          - Collections Monitoring Analytics
      - id: process-adjustments-and-deductions
        name: Process Adjustments and Deductions
        l3:
          - Establish policies/procedures for adjustments
          - Analyze adjustments
          - Correspond/Negotiate with customer
          - Discuss resolution with internal parties
          - Prepare chargeback invoices
          - Process related entries
      - id: revenue-recognition
        name: Revenue Recognition
        l3:
          - Obtain Revenue Data Source
          - Reconcile source data to internal data (GL)
          - Review and reconcile deferred revenue schedules
          - Prepare and process related entries

  - id: record-to-report
    name: Record to Report
    description: Collect, process, and present accurate financial data; close the books
    contacts: []
    l2:
      - id: pre-close-set-up
        name: Pre-Close Set Up
        l3:
          - Master Data Configuration
          - Ledger Configuration
          - Cost and Profit Center Reporting
          - Manage User Access Rights (SOD)
          - Division of Labor and Responsibilities
          - Close Checklist
          - Pre-Close Meetings
          - Data Governance
      - id: close
        name: Close
        l3:
          - Sub-Ledger Close
          - Intercompany & Allocations
          - Accruals
          - Non-Standard Journal Entries
          - Trial Balance & GL Close
          - Account Reconciliations
          - Prepare Local Financials
          - Management Review
      - id: consolidation
        name: Consolidation
        l3:
          - Collect Data
          - Intercompany Eliminations (Asset, Debt, Income, Inventory)
          - Equity Accounting
          - Topside Entries
          - Consolidate Information
          - Corporate Review
          - Variance Analysis
          - Analytic Driven Review
      - id: reporting
        name: Reporting
        l3:
          - Management Reporting
          - Consolidated Financial Statements
          - Prepare Regulatory Reports
          - Investor Relations Support
          - Close & Reporting Analytics
      - id: accounting-policy
        name: Accounting Policy
        l3:
          - Baseline Accounting Policies & Procedures
          - Revenue Recognition (606)
          - Lease Accounting (842)
          - New Accounting Standards

  - id: fpa
    name: Financial Planning & Analysis
    description: Budgeting, forecast, and analyze the organization's financial health
    contacts:
      - Rob Winslow
      - John Cornelio
      - John McCabe
    l2:
      - id: strategic-planning-and-budgeting
        name: Strategic Planning & Budgeting
        l3:
          - Alignment w/ Corporate Initiatives
          - Annual Operating Plan
          - Headcount Planning
          - CapEx Planning
          - Incentive/Commission Planning
          - Long-range target planning
      - id: forecasting
        name: Forecasting
        l3:
          - Cash flow analysis
          - Point-In-Time Forecasting
          - Scenario / what-if analysis
          - Trend Analysis
          - Predictive Analytics
          - Rolling Forecasts
      - id: reporting-and-analysis
        name: Reporting & Analysis
        l3:
          - KPIs
          - Variance analysis
          - Management Reporting
          - External Reporting
          - Benchmarking
          - Data Visualization
          - Dashboarding
          - Self-Service Reporting
      - id: business-support
        name: Business Support
        l3:
          - Project Management
          - ROI Tracking
          - Business Case Development
          - Cost & Profitability Analysis
      - id: data-management
        name: Data Management
        l3:
          - Data Collection
          - Data Governance
          - Master data management (Single Source of Truth)

  - id: treasury
    name: Treasury
    description: Ensure sufficient cash to fund the business; manage cash, investments, and liquidity
    contacts:
      - Rob Winslow
      - Caleb Mutti
    l2:
      - id: cash-management
        name: Cash Management
        l3:
          - Entity structure
          - Funding/capital markets
          - FX
          - Working capital
          - Reporting
      - id: investment-management
        name: Investment Management
        l3:
          - Sweeps
          - Pooling (physical/notional)
          - ALM
          - Portfolio management
          - Reporting
          - KPI
          - BI & Dashboarding
      - id: liquidity
        name: Liquidity
        l3:
          - Intraday liquidity
          - Daily liquidity
          - Stressed liquidity
          - Concentration (generally only for banks)
          - Reporting
          - Analytics and Predictive AI
      - id: financial-risk
        name: Financial Risk
        l3:
          - Liquidity risk
          - Counterparty risk
          - Interest Rate risk
          - Reporting
          - Limits/KRI/EWI
          - Advanced Controls
          - Real-time KPIs and Business Impacts
          - Threat Intelligence
      - id: interest-rate-management
        name: Interest Rate Management
        l3:
          - Hedging (forwards, futures, swaps, options, swaptions)
          - Forecast
          - Reporting

  - id: tax
    name: Tax
    description: Deliver efficient, credible tax planning, reporting, and compliance; pay the right amount of tax
    contacts:
      - Joel Gardosik
      - Prapti Patel
      - John McCabe
    l2:
      - id: tax-reporting
        name: Tax Reporting
        l3:
          - Tax Payables / Receivables
          - Tax Expense / Benefit Deferred
          - Tax Basis in Assets and Liabilities
          - Tax Reconciliations
          - Effective Tax Rates
          - Statutory Accounts and Filings
          - Predictive Analytics on Effective Tax Rates
      - id: income-tax-compliance
        name: Income Tax Compliance
        l3:
          - Local Tax Filings
          - Financial Statement True-Up Entries
          - Tax Payments
          - Taxable Presence Risk
          - Tax Compliance Analytics
          - Monitoring of Emerging Tax Laws and Regulations
      - id: indirect-tax
        name: Indirect Tax
        l3:
          - Indirect Tax Determination
          - Indirect Tax Return Filings
          - Indirect Tax Payments
          - Indirect Tax Recovery
          - Indirect Tax Analytics
      - id: tax-controversy
        name: Tax Controversy
        l3:
          - Tax Authority Correspondence
          - Data Supporting Tax Positions
          - Tax Audit Management
          - Analytics on Reporting to Tax Authorities
      - id: tax-strategy-and-planning
        name: Tax Strategy & Planning
        l3:
          - Tax Opportunity Planning
          - Transfer Pricing
          - Business Transaction Tax Advice
          - Tax Structure Planning
          - Tax Risk Monitoring
          - Global Mobility
          - Tax Scenario Planning
          - Analytics-Enabled Tax Monitoring

  - id: risk-policy-controls
    name: Risk, Policy & Controls
    description: Assess and manage risk through effective oversight, policy, and controls; minimize risk using internal controls
    contacts:
      - Rob Winslow
      - John McCabe
    l2:
      - id: policies-and-procedures
        name: Policies & Procedures
        l3:
          - Board of directors and audit committee
          - Code of Ethics
          - Roles and responsibility for internal controls
          - Business process objectives and risks
          - Entity/unit risk tolerances
      - id: risk-assessment
        name: Risk Assessment
        l3:
          - Risk identification
          - Vulnerability assessment
          - Impact analysis
          - Mitigation strategy
          - Risk Analytics
          - Cyber Security
      - id: internal-controls
        name: Internal Controls
        l3:
          - Separation of Duties
          - System Access Controls
          - Physical Audits of Assets
          - Standardized Documentation
          - Daily or Weekly Trial Balances
          - Periodic Reconciliations in Systems
          - Approval Authority Requirements
          - System-Driven Controls
      - id: monitoring
        name: Monitoring
        l3:
          - Periodic evaluation and testing of controls by internal audit
          - Continuous monitoring programs built into information systems
          - Supervisory reviews of controls
          - Self-assessments by boards and management
          - Audit committee inquiries of internal and external auditors
          - Quality assurance reviews of the internal audit department
          - Analytics and Predictive AI
          - Real-time KPIs and Business Impacts
      - id: reporting
        name: Reporting
        l3:
          - Report to external auditors
          - Report to regulators, share-/debtholders, securities exchanges, etc.
          - Report to third parties (e.g., business partners)
          - Report to internal management
