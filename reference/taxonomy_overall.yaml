# CFGI Work Taxonomy — Overall
# Source: Work Taxonomy High-Level Overview deck
# Maps encoded per node (where determinable from color coding):
#   pain_point: high | med | low | strength   (red=pain point, white/light=strength)
#   automation:  machine | mixed | human       (dark blue=machine, light=mixed, white=human)
#   capability:  new | existing                (green=new, white=existing)
#   operating_model: central | mixed | local   (dark purple=central, light=mixed/local, white=local)
# Omitted ratings where color was ambiguous or not applied in source slides.
# "new_capability" items appear in New Capabilities and Operating Model maps but not Current State.

