systems:
- slug: coupa
  name: Coupa
  aliases:
  - Coupa
  - SIM portal
  - Supplier Information Management
  description: System of record for the supplier record from a sourcing standpoint;
    requisitions, purchase orders, approval chains, and supplier self-registration
    (SIM).
  limitations: ''
  confidence: high
- slug: netsuite
  name: NetSuite (S/4-equivalent ERP)
  aliases:
  - NetSuite
  - NS
  - the ERP
  description: System of record for the vendor master (payment side), item receipts,
    bills, payment runs, and bank reconciliation.
  limitations: Nightly Coupa->NetSuite supplier sync occasionally lands records with
    a blank payment term, requiring manual correction; no named owner or monitoring/alerting
    on sync failure.
  confidence: high
- slug: ephesoft
  name: Ephesoft
  aliases:
  - Ephesoft
  - the OCR thing
  - document capture application
  description: OCR/document capture application that extracts invoice header data
    (vendor, invoice number, date, total, PO reference) and routes low-confidence
    extractions to a manual validation queue.
  limitations: ''
  confidence: high
- slug: chase-connect
  name: Chase Connect
  aliases:
  - Chase Connect
  - the portal
  - the banking portal
  - depository institution's commercial banking portal
  description: Commercial banking portal used for ACH file upload/release, wire initiation/approval,
    positive pay exception disposition, and the ACH debit block/filter.
  limitations: ''
  confidence: high
- slug: concur
  name: Concur
  aliases:
  - Concur
  description: Employee travel & expense system. Explicitly out of Procure-to-Pay
    scope per client direction; reimbursement runs through payroll's ACH file on a
    separate bank account, not the AP payment run.
  limitations: ''
  confidence: high
