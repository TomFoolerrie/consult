glossary:
- term: GR/IR accrual
  definition: 'Goods-Receipt/Invoice-Receipt accrual: the month-end journal covering
    goods received but not yet invoiced. Booked as part of Record to Report''s close;
    Procure to Pay''s goods-receipt postings are its input.'
- term: NTE
  definition: 'Not-to-exceed: the annual ceiling set on a blanket purchase order.'
- term: RMA
  definition: 'Return Merchandise Authorization: the vendor-issued number used to
    process a return of received goods.'
- term: cXML
  definition: The electronic PO transmission format Coupa uses with enabled suppliers;
    suppliers not enabled receive the PO as a PDF by email.
- term: AFE
  definition: 'Authorization for Expenditure: a custom field required on capital-expenditure
    requisitions before Coupa will route them for approval.'
- term: Confirming PO
  definition: A purchase order created after work has already been performed or goods
    already ordered without one, to regularize an emergency or off-process purchase.
- term: The cage
  definition: A fenced holding area at the Plant 2 dock for received goods that cannot
    be tied to an open purchase order.
