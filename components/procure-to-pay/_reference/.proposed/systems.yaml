systems:
  - slug: coupa
    name: Coupa
    aliases: ["Coupa", "the SIM portal", "Supplier Information Management portal"]
    description: "System of record for supplier onboarding from a sourcing standpoint, requisitions, purchase orders and change orders. Includes a supplier self-registration (SIM) portal in which suppliers enter their own banking, W-9, insurance certificates and diversity classification."
    limitations: "Nightly supplier sync to NetSuite fails intermittently; records can land with blank payment terms and are corrected by hand. Hosted/punchout catalog pricing is stale relative to negotiated contracts. Blanket PO not-to-exceed burn-down report exists but is not run on a schedule."
    confidence: high

  - slug: netsuite
    name: NetSuite
    aliases: ["NetSuite", "NS", "the ERP", "the system"]
    description: "General ledger, vendor master for payment purposes, item receipts, bill entry, three-way match, approval routing, Pay Bills / payment proposal, positive pay issue file and bank reconciliation. Duplicate invoice prevention via a unique constraint on supplier plus supplier invoice number."
    limitations: "Match tolerance, non-PO approval ladder and approval-escalation configuration could not be confirmed by any interviewee; the configuration has not been pulled."
    confidence: high

  - slug: ephesoft
    name: Ephesoft
    aliases: ["Ephesoft", "the OCR thing", "the document capture application", "the imaging system"]
    description: "OCR/document capture applied to all emailed and scanned invoice images; extracts supplier name, invoice number, invoice date, total, currency and PO reference, then pushes a pending Bill into NetSuite. Documents below the confidence threshold route to a manual validation queue."
    limitations: "PO number extraction is unreliable when the PO reference is embedded in body text. The confidence threshold is stated as 90% in the SOP but believed to be around 75% in practice; unconfirmed."
    confidence: high

  - slug: chase-connect
    name: Chase Connect
    aliases: ["Chase Connect", "the portal", "the payments portal", "the bank portal", "the commercial banking portal"]
    description: "Bank portal used for NACHA/ACH file upload and release, wire initiation and approval, positive pay exception disposition, and ACH debit block with an authorized-originator filter list."
    limitations: ""
    confidence: high

  - slug: ap-inbox
    name: AP Inbox
    aliases: ["AP Inbox", "ap-invoices@", "the shared mailbox", "the accounts payable electronic mailbox"]
    description: "Shared Outlook mailbox that receives the large majority of supplier invoices; stated on PO terms as the required delivery address."
    limitations: ""
    confidence: high

  - slug: finance-shared-drive
    name: Finance Shared Drive
    aliases: ["the shared drive", "Finance/Treasury/Forms"]
    description: "Holds the wire transfer request form PDF, the manual known-not-received accrual spreadsheet, and (per SOP) statement reconciliation worksheets."
    limitations: "Retention location for the payment proposal Excel export was not established."
    confidence: medium
