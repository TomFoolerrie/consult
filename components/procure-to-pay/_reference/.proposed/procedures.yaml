procedures:
  # --- Vendor Management ---
  - slug: new-supplier-onboarding
    title: New Supplier Onboarding
    l2: vendor-management
    confidence: high
    sources: [SRC-003, SRC-006, SRC-009]
    variants: []
    upstream: []
    gap_forecast:
      - "Coupa->NetSuite nightly supplier sync has no named owner and no monitoring/alerting when it breaks (blank payment terms land and Tobias fixes by hand)."
      - "No documented process for the ~11,000 supplier records / ~4,000 active-in-24mo cleanup; duplicate suppliers exist under different spellings with no dedup owner."

  - slug: vendor-banking-change
    title: Vendor Banking Detail Change Control
    l2: vendor-management
    confidence: medium
    sources: [SRC-001, SRC-003, SRC-004, SRC-006]
    variants: []
    upstream: []
    gap_forecast:
      - "Callback-verification ownership is unresolved: SOP 9.4 names the AP Specialist, the Controller says Procurement, Procurement says AP (Tobias) -- the three accounts disagree and nobody has reconciled them."
      - "Identity of the required second approver on a banking change is unconfirmed -- the Controller speculated it may be herself."

  - slug: vendor-master-file-review
    title: Supplier Master File Review & Access Governance
    l2: vendor-management
    confidence: low
    sources: [SRC-001, SRC-004, SRC-006]
    variants: []
    upstream: []
    gap_forecast:
      - "SOP 9.5 requires a semi-annual review of the supplier master for inactive/duplicate/incomplete records; no one interviewed could confirm it has ever been performed."
      - "A legacy implementation-partner login retains Vendor Maintenance-equivalent access in NetSuite; the Controller is aware and it is unremediated."

  - slug: vendor-statement-reconciliation
    title: Vendor Statement Reconciliation
    l2: vendor-management
    confidence: medium
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-006]
    variants: []
    upstream: [po-invoice-three-way-match, non-po-invoice-approval-and-coding]
    gap_forecast:
      - "Cadence and population disagree across every source: SOP states monthly for all vendors over $50k annual spend; the Controller has accepted quarterly for a 'top vendor' list; the AP Specialist works from a vendor list last refreshed circa 2024; Procurement doubts the process happens at all in some quarters."

  # --- Procurement ---
  - slug: requisition-to-po
    title: Requisition to Purchase Order
    l2: procurement
    confidence: high
    sources: [SRC-003, SRC-006, SRC-009]
    variants: []
    upstream: []
    gap_forecast:
      - "Median requisition-to-PO cycle time (6.5 days, ~5 in approvals) is sourced from the Procurement Lead's personal spreadsheet, not a system report -- treat as directional only."
      - "Punchout catalog pricing is reported stale against negotiated contracts, causing off-contract buying with no described remediation owner."

  - slug: confirming-purchase-orders
    title: Confirming (After-the-Fact) Purchase Orders
    l2: procurement
    confidence: medium
    sources: [SRC-003, SRC-006, SRC-009]
    variants: []
    upstream: [requisition-to-po]
    gap_forecast:
      - "Coupa configuration has no field or chain to flag a requisition as a confirming PO -- volume (Procurement's estimate: 15-20/month, concentrated at Plant 2) cannot be reported from any system."
      - "Required written justification from the plant manager is described as, in practice, an email from anyone -- the control as designed is not the control as operated."

  - slug: blanket-po-management
    title: Blanket Purchase Order Management
    l2: procurement
    confidence: high
    sources: [SRC-003, SRC-006, SRC-007]
    variants: []
    upstream: [requisition-to-po]
    gap_forecast:
      - "Whether the 5%/$500 over-receipt tolerance should differ for Plant 3's automated consumption receipts (see [[plant-3-consumption-based-receiving]]) is unresolved -- the Buyer had no view and named the Procurement Lead as owner."

  # --- Receiving ---
  - slug: goods-receipt
    title: Goods Receipt (Standard Dock Process)
    l2: receiving
    confidence: high
    sources: [SRC-005, SRC-006, SRC-007, SRC-008, SRC-010]
    variants: []
    upstream: [requisition-to-po]
    gap_forecast:
      - "No described resolution process or owner for unmatched receipts held in the 'cage' (roughly 30 pallets observed, some since the prior fall) -- these originate from direct-to-vendor calls made outside the requisition process."
      - "Receipts entered late (second-shift keying deferred to the next morning) are independently named by AP, Procurement, and the Controller as the root cause of roughly 60% of downstream match exceptions."

  - slug: plant-3-consumption-based-receiving
    title: "Plant 3: Kanban Consumption-Based Receiving"
    l2: receiving
    confidence: medium
    sources: [SRC-005, SRC-006, SRC-007, SRC-010]
    variants: []
    upstream: [blanket-po-management]
    gap_forecast:
      - "The nightly NS-BACKFLUSH-GR batch job that auto-posts the goods receipt from production backflush has no named owner and no failure alerting -- the same integration-ownership gap already flagged for the Coupa->NetSuite supplier sync."
      - "The rule excluding supplier-owned bin stock from cycle counts and the month-end inventory reconciliation is described by both the Buyer and the Plant Controller as 'in our heads,' with no written procedure on the inventory side."

  - slug: service-po-receipt-confirmation
    title: Service Purchase Order Receipt Confirmation
    l2: receiving
    confidence: low
    sources: [SRC-005, SRC-006]
    variants: []
    upstream: [requisition-to-po]
    gap_forecast:
      - "No one interviewed could describe how the requesting department confirms receipt of a service PO in the system -- the Receiving Supervisor states plainly it is not his dock and he has never seen it done; no process owner was identified."

  - slug: vendor-returns-rma
    title: Vendor Returns & RMA
    l2: receiving
    confidence: medium
    sources: [SRC-005, SRC-006]
    variants: []
    upstream: [goods-receipt]
    gap_forecast:
      - "The credit-memo application step after a return is unaddressed by any source -- the Receiving Supervisor believes 'AP chases that' but no AP source describes the process, and whether returned-goods credits are ever confirmed against the vendor account is unknown."

  # --- Invoice Processing ---
  - slug: invoice-capture-and-intake
    title: Invoice Capture & Intake
    l2: invoice-processing
    confidence: high
    sources: [SRC-001, SRC-002, SRC-006]
    variants: []
    upstream: []
    gap_forecast:
      - "The OCR (Ephesoft) confidence-score threshold that routes an invoice to manual validation is stated as 90% in the SOP and recalled as roughly 75% by the AP Manager (who does not stand behind the number) -- neither has been confirmed against the live Ephesoft configuration."

  - slug: po-invoice-three-way-match
    title: PO Invoice Entry & Three-Way Match
    l2: invoice-processing
    confidence: medium
    sources: [SRC-001, SRC-002, SRC-004, SRC-006]
    variants: []
    upstream: [invoice-capture-and-intake, goods-receipt, requisition-to-po]
    gap_forecast:
      - "The matching tolerance itself is unconfirmed and is DISTINCT from the (system-confirmed) 5%/$500 over-receipt tolerance at goods receipt: the SOP states 5% or $100 (lesser); the AP Manager recalls 3% or $250; the Controller recalls 5% or $500 'fairly confident' but unverified -- nobody has pulled the actual NetSuite match-tolerance configuration."

  - slug: non-po-invoice-approval-and-coding
    title: Non-PO Invoice Coding & Approval
    l2: invoice-processing
    confidence: high
    sources: [SRC-001, SRC-002, SRC-006, SRC-009]
    variants: []
    upstream: [invoice-capture-and-intake]
    gap_forecast:
      - "SOP 6.4's automatic three-business-day escalation is contradicted directly by the Senior AP Specialist, who describes approvals sitting in queues for roughly two weeks with no escalation -- either the workflow rule is not configured as documented or it is not functioning."
      - "Freight bills on collect shipments raise an unresolved question of who is authorized to accept collect charges -- no process is described."

  # --- Payments ---
  - slug: weekly-payment-run
    title: Weekly Payment Run (ACH)
    l2: payments
    confidence: medium
    sources: [SRC-001, SRC-002, SRC-004, SRC-006, SRC-008]
    variants: []
    upstream: [po-invoice-three-way-match, non-po-invoice-approval-and-coding]
    gap_forecast:
      - "The weekly proposal/review/release calendar has three different accounts on record (SOP: propose Monday, release Wednesday; Controller: propose Tuesday, review Wednesday, release Thursday; AP Manager: propose Wednesday, release Thursday) -- if the AP Manager's account is correct, the Controller is reviewing and releasing the same morning, which she herself flagged as a potential control finding."
      - "The ACH second-approver requirement is described as universal, no-floor practice by the AP Manager but as a $100,000 entitlement threshold (functionally always met) by the Controller -- the actual Chase Connect entitlement configuration has not been pulled."

  - slug: wire-transfers
    title: Wire Transfers
    l2: payments
    confidence: high
    sources: [SRC-001, SRC-002, SRC-004, SRC-006]
    variants: []
    upstream: []
    gap_forecast: []

  - slug: check-disbursement
    title: Check Disbursement & Positive Pay
    l2: payments
    confidence: medium
    sources: [SRC-001, SRC-002, SRC-004, SRC-006]
    variants: []
    upstream: []
    gap_forecast:
      - "SOP 7.5 requires written Controller authorization for manual/emergency check issuance; no source describes an actual instance or confirms the control operates as written -- frequency was never asked."
