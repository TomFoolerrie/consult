glossary:
  - term: "AP Inbox"
    definition: "The shared Outlook mailbox ap-invoices@ to which suppliers are directed to send invoices."
  - term: "Confirming PO"
    definition: "A purchase order created after the fact, once a vendor has already performed the work or delivered without an approved PO."
  - term: "The cage"
    definition: "A fenced area at the Plant 2 dock where received material that cannot be tied to a purchase order is held until claimed."
  - term: "Match Exception - Hold"
    definition: "The NetSuite bill status applied when the three-way match fails, blocking release until resolved."
  - term: "AFE"
    definition: "Authorization for expenditure; a capital-expenditure approval number required in a custom field before a cap-ex requisition will route."
  - term: "NTE"
    definition: "Not-to-exceed; the annual value ceiling on a blanket purchase order, released against by receipt."
  - term: "RNI"
    definition: "Received-not-invoiced; open receipts with no bill, accrued systematically at close."
  - term: "SIM"
    definition: "Coupa Supplier Information Management — the portal through which suppliers self-register banking, W-9, insurance certificates and diversity classification."
  - term: "Cost Center Owner"
    definition: ""
  - term: "Punchout"
    definition: ""
