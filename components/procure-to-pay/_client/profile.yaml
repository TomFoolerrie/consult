# _client/profile.yaml — Nordhaven Industrial Group, Procure to Pay
# Document profile (M14). Human-owned: this file decides document SHAPE.
#
# Decision: Known Issues & Improvement Opportunities is kept OUT of each
# procedure body and read only as a document-level register (Appendix A).
# The fragments still carry the full text; `body_omit` is a view, so turning
# the section back on restores it with nothing to re-draft.
#
# WANTED BUT NOT YET POSSIBLE — `controls` in `body_omit`:
#   Moving Key Controls to a register needs the `appendix-controls` component
#   (89_appendix-controls.md) in manifest.json. The manifest is written only by
#   `scaffold.py --confirm`, which requires `_reference/.proposed/`, so an area
#   already scaffolded cannot gain the component. Adding `controls` here today
#   passes the profile validator (it checks THIS list) while render builds from
#   the manifest — so every control disappears from the document. Do not add
#   `controls` to `body_omit` until the scaffold/manifest gap is fixed.

profile:
  body_omit:
    - issues

  derived:
    - procedure-index
    - role-dictionary
    - systems
    - dependencies
    - raci
    - appendix-a          # PP / IO register — the pain-point destination
    - gap-log
    - screenshot-index
    # - appendix-controls # add together with `controls` above, once supported
