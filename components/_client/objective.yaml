objective:
  goal: >
    Assess the procure-to-pay cycle as it runs today and tell Nordhaven where
    it can do better — the points where disconnected systems, missing
    integration, absent automation, and avoidable manual effort hold the
    process back — and deliver a prioritized recommendation list they can act
    on.
  deliverables: [findings-report]
  cycles: [procure-to-pay]
