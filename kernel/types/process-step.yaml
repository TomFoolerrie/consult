# kernel/types/process-step.yaml — the v2-native type (the backbone).
#
# The deliverable-neutral shape of a unit of process understanding, per the
# charter's IPO decision (M33 spec, Amendment A1 parts table). Born-v2:
# no legacy corpus, so no title/letter/slug aliases. Callouts carry over
# the v1 vocabulary (continuity ruling: PAIN POINT keeps label + PP prefix),
# homed against THIS type's part slugs.

type: process-step

parts:
  - slug: scope
    title: Scope
    kind: prose
  - slug: inputs
    title: Inputs
    kind: list
  - slug: transformation
    title: Transformation
    kind: prose
  - slug: outputs
    title: Outputs
    kind: list
  - slug: controls
    title: Controls
    kind: prose
  - slug: issues
    title: Issues
    kind: prose

# The v1 callout vocabulary, re-homed to process-step parts.
# Continuity ruling: pain keeps label PAIN POINT, prefix PP, home issues.
callouts:
  # CONTROL declares the M42 field vocabulary (M43 Part C): the four facts a
  # control statement is made of. OPTIONAL metadata — documentation for the
  # drafter and vocabulary for consumers (scripts/hygiene.py's thin-CTRL
  # feeder reads the names from here rather than typing them). NOT a parse
  # gate: a prose-only CTRL parses exactly as it always has, and whether the
  # prose carries these facts is the librarian's judgment, not the kernel's.
  - {label: CONTROL, prefix: CTRL, home: controls,
     fields: [Performer, Comparison, Trigger, Evidence]}
  # GAP declares its two M44 fields (the grammar amendment ruled 2026-08-16):
  # Grounds — what makes the absence/conflict claim checkable (the sources
  # read, or the confirming citation) — and Nature, which says WHICH of the
  # two mints this gap is. Same posture as CONTROL's fields: optional
  # metadata, never a parse gate.
  #
  # `field_enums` declares the vocabulary a field's value is drawn from, so
  # consumers read the two-mint discrimination from here rather than typing
  # the words (M50, the M36 shape-audit rule applied to a field value): a
  # `conflict` is two sources disagreeing, an `evidenced-absence` is the
  # sources confirming something is missing. Still NOT a parse gate — a GAP
  # with no Nature, or one whose Nature is outside this list, parses exactly
  # as it always did and is simply undiscriminated to its consumers.
  - {label: VALIDATION REQUIRED, prefix: GAP, home: issues,
     fields: [Grounds, Nature],
     field_enums: {Nature: [conflict, evidenced-absence]}}
  - {label: PAIN POINT, prefix: PP, home: issues}
  - {label: IMPROVEMENT OPPORTUNITY, prefix: IO, home: issues}
  - {label: SCREENSHOT PLACEHOLDER, prefix: SC, home: transformation}

# The consult-meta binding channels (same registries as activity).
channels:
  - {name: systems, registry: systems.yaml}
  - {name: roles, registry: roles.yaml}
