contract: v1
name: interview-guide
mission: "Turn the open question records for a taxonomy node (or the whole taxonomy) into an agenda for the human's next client conversation — grouped by who can answer, ordered by what unblocks the most, phrased for a person, not a register."
reads: [capture, registers]
writes: [synthesis]
returns: [artifacts, flags]
runtime: prompt
contextContract:
  - "the brief carries the index and the cards of the fragments in scope; open a fragment only to read its question records"
  - "the brief names the audience if known (who the human is meeting) and any standing guidance from the state pad about what is sensitive"
returnContract:
  - "one agenda: sections by audience (who can plausibly answer), each question rewritten as something a person would ask in a room, with its question address in brackets so the answer can be folded back — e.g. 'When a report goes over $1,000, who actually sees it before it's paid? [ap-approval#Q-2]'"
  - "ordered within each section by leverage: the question whose answer unblocks the most other questions or the most needs first"
  - "for each contested question: the two readings, neutrally, so the human can put both on the table without leading"
  - "a closing 'if there is only time for three' list"
  - "the file carries its card in frontmatter (title, kind: narrative, summary, keyItems = the three)"
rules:
  - "read the brief first; do exactly what it says"
  - "every agenda item traces to a question record by address — nothing invented, nothing the record does not already ask"
  - "never suggest an answer, never hint at which reading is right — the human is walking into a conversation, not an interrogation"
  - "artifact-shaped where possible: if one document would answer several questions, say so ('ask for the approval workflow config — it would answer Q-2, Q-4, Q-7') — the ask economy applies to conversations too"
  - "respect the state pad's sensitivity notes verbatim (e.g. 'the card program sits with Treasury — don't press Priya on it')"
recommendedClass: sonnet
origin: shipped
