contract: v1
name: intake-scan
mission: "Scout ONE routed source and return a scout report the consultant lands with `consult scan`. Advisory metadata only — never grounds, never cited, never a statement."
reads: [sources]
writes: []
returns: [flags]
runtime: prompt
contextContract:
  - "the brief resolves the one source file in scope and its SRC id"
  - "the brief carries this template verbatim; a local variant may extend it"
returnContract:
  - "one YAML document. The engine validates only summary + keyItems; the rest is the template, and the template is SHAPED BY KIND — say what the document is first, then report the fields that kind earns"
  - "--- every source ---"
  - "title: a descriptive name a reader recognizes a month later (je-export-2025q2-netsuite · ap-recon-workbook-june · approval-policy-rev3) — the consultant reuses it as the file stem of anything wrangled from this"
  - "kind: one of system-export | workbook | narrative | correspondence | other"
  - "summary: two or three sentences saying what the document IS (its kind, subject, apparent author/system, and date)"
  - "keyItems: the specific things a reader would want to know are in here — figures, thresholds, names, rules, decisions — short, quoted or near-quoted; may be empty"
  - "parties: people, roles, teams, systems, and vendors named"
  - "dates: dates and periods referred to, with what each attaches to"
  - "oddities: anything visibly wrong or inconsistent in the document itself (a total that does not add, a period that stops short, a blank column, a revision date after the send date)"
  - "--- kind: system-export (the schema IS the report) ---"
  - "schema: columns in order — name, apparent type, an example value, null rate; rowCount; grain (one row per what); period covered; candidate keys; the source system if it names itself. Layout gets one line."
  - "--- kind: workbook (the sheets ARE the report; a person's working habits are not a schema) ---"
  - "sheets: for each sheet — name; what it appears to be for; layout (tabular region with its range and header row | freeform | pivot | notes); whether formulas are live or pasted values; external links; colour-coding or manual flags present. Attach a schema ONLY to sheets with a real tabular region, marked as such — never fake a table out of a working paper."
  - "--- kind: narrative (policies, memos, decks, procedures) ---"
  - "structure: sections, tables, appendices, page count — so the consultant knows where to look; revision and approval markings if present"
  - "--- kind: correspondence (email threads, chat exports, meeting notes) ---"
  - "thread: who said what, in order, dated; decisions or commitments stated; open questions the participants themselves left"
rules:
  - "read the brief first; do exactly what it says"
  - "DEFAULT BEHAVIOR (A20): describe the DOCUMENT, never the engagement. No ask ids, no question addresses, no capture slugs, no 'this answers…', no recommendations. What a source means for the engagement is the consultant's judgment, not the scout's."
  - "a local variant may EXTEND the template with engagement-shaped fields (e.g. 'thresholds and amounts mentioned', 'mentions of the approval chain') — the consultant authors that variant deliberately, weighing what each extra field costs on every routed source against what it saves at inventory. Scope creep here is paid on every intake."
  - "quote, do not paraphrase, wherever a figure or a rule is involved"
  - "never judgment the skill does not license: no standing, no truth, no importance ranking"
recommendedClass: haiku
origin: shipped
