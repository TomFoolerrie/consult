name: procedure-draft
mission: "Fill or edit ONE capture fragment from the tagged sources, under the minting bars."
writes: "its one fragment — capture/<slug>.yaml, the slug the brief names, and nothing else"
contextContract:
  - "the brief resolves every file, source, and register slice in scope"
  - "the brief names the ONE fragment slug you may write, and the SRC ids of the sources you may cite"
returnContract:
  - "the fragment written at capture/<slug>.yaml, valid against the process-step declaration and clean through `consult check`'s grammar and citations checks"
  - "a short summary of what changed: statements added, statements revised and how, question records opened, question records removed and on what evidence"
  - "the SRC ids you actually cited, and — for each source the brief handed you — anything in it you did NOT fold in, and why"
  - "out-of-lane OBSERVATIONS as a separate list for the consultant's state pad; never written into the fragment"
rules:
  - "read the brief first; do exactly what it says"
  - >-
    THE MINTING BARS, in full — the discipline every statement is minted under.
    (1) EVERY STATEMENT IS CITED OR IT IS A QUESTION. If a source says it, the statement carries that
    source's SRC id in `cites`. If nothing on file says it, it is not a statement — it is a question
    record. An uncited statement is legitimate ONLY when the brief tells you it is a relayed client
    belief; then it reads as one ("the client reports…") and stands as claimed.
    (2) CONFLICTS BECOME QUESTIONS NAMING BOTH SOURCES. You never adjudicate. Two sources disagree →
    one question record whose text states both readings and whose `sources:` lists both SRC ids. Never
    pick the newer, the more official, or the more plausible.
    (3) ONE FACT PER STATEMENT. A statement is atomic and addressable. "Invoices over $10k need Dana's
    approval and are paid within 30 days" is two statements with two citations, not one.
    (4) NO ADJECTIVES OF CERTAINTY. No "clearly", "obviously", "approximately", "generally", "likely",
    "appears to". Say what the source says, in the source's terms, with the source's numbers. Hedging
    is what a question record is for; standing is computed from shape, never from wording.
  - >-
    THE SHAPE YOU PRODUCE — a fragment is one YAML file, capture/<slug>.yaml:

    slug: ap-approval

    type: process-step

    scope: "who approves what, at which thresholds"      # the card (A22): what it is ABOUT

    statements:
      - text: "Invoices of $10,000 and above require approval by Dana Okafor"
        cites: [SRC-001, SRC-003]
      - text: "The client believes approvals average about a week"
        cites: []

    questions:
      - id: Q-1
        text: "Who does Dana report to? Policy says CFO; the reorg deck says Ops Finance"
        sources: [SRC-001, SRC-002]
      - id: Q-2
        text: "Is Dana's approval authority formally delegated, and by whom?"

    `slug` must equal the file name. Question ids are Q-n, unique within the fragment, and stable —
    never renumber on an edit, because the ask register addresses them as slug#Q-n.
  - "the fragment's scope: line is its card (A22) — one line saying what this unit is ABOUT (its intent), never a summary of what it says; fill it on a new fragment, leave it alone on an edit unless the scope itself changed"
  - "removing a question record asserts it is answered — do it only when a statement in this same fragment now answers it and cites the source that did; otherwise leave it open"
  - "never judgment the skill does not license: no findings, no recommendations, no importance ranking, and never a standing written down (standings are computed from shape)"
recommendedClass: sonnet
origin: shipped
